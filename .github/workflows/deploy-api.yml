name: Deploy API to VPS

on:
    push:
        branches: [main]
        paths:
            # packages/** is here because the API compiles @bzim/types into its
            # image. A change to a shared enum is a change to the API, even
            # though no file under apps/api moved.
            - 'apps/api/**'
            - 'packages/**'
            - 'docker-compose.prod.yml'
            - '.github/workflows/deploy-api.yml'
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            # The context is the repository root, not apps/api: the image needs
            # the root lockfile and the shared package.
            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./apps/api/Dockerfile
                  push: true
                  tags: |
                      ${{ secrets.DOCKERHUB_USERNAME }}/bzim-api:latest
                      ${{ secrets.DOCKERHUB_USERNAME }}/bzim-api:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # envsubst replaces every $NAME in the template with the matching
            # variable and leaves the literal lines alone. Nothing secret is
            # committed: .env.dist holds only placeholders.
            - name: Render .env from the template
              working-directory: apps/api
              env:
                  DB_HOST: ${{ secrets.DB_HOST }}
                  DB_PORT: ${{ secrets.DB_PORT }}
                  DB_USER: ${{ secrets.DB_USER }}
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  DB_NAME: ${{ secrets.DB_NAME }}
                  JWT_SECRET: ${{ secrets.JWT_SECRET }}
                  APP_KEY: ${{ secrets.APP_KEY }}
                  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  CALENDAR_TOKEN_KEY: ${{ secrets.CALENDAR_TOKEN_KEY }}
                  VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
                  VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
                  VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
                  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
                  UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
                  MAIL_FROM_EMAIL: ${{ vars.MAIL_FROM_EMAIL }}
                  MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
                  WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
                  # Repository variables rather than secrets: public hostnames
                  # that can be changed in the UI and redeployed.
                  APP_URL: ${{ vars.APP_URL }}
                  API_URL: ${{ vars.API_URL }}
                  COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
                  TRUST_PROXY_HOPS: ${{ vars.TRUST_PROXY_HOPS }}
              run: |
                  envsubst < .env.dist > .env

                  # A name that is not set substitutes to an empty string rather
                  # than failing, so the check has to happen here. The list grows
                  # as tasks add secrets; .env.dist is the source of truth.
                  missing=""
                  for name in DB_HOST DB_USER DB_NAME JWT_SECRET APP_KEY WORKER_TOKEN APP_URL API_URL; do
                    grep -q "^${name}=.\+" .env || missing="${missing} ${name}"
                  done
                  if [ -n "${missing}" ]; then
                    echo "::error::Empty after rendering:${missing}. Set them as repository secrets or variables."
                    exit 1
                  fi
                  echo "Rendered .env with $(grep -c '=' .env) values."

            - name: Setup SSH agent
              uses: webfactory/ssh-agent@v0.10.0
              with:
                  ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

            - name: Transfer deployment files to VPS
              run: |
                  ssh -o StrictHostKeyChecking=accept-new \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
                    "mkdir -p /opt/apps/bzim"

                  # Compose interpolates the image name from DOCKERHUB_USERNAME,
                  # so that has to sit in the same file the app reads its own
                  # configuration from.
                  printf 'DOCKERHUB_USERNAME=%s\n' '${{ secrets.DOCKERHUB_USERNAME }}' > deploy.env
                  cat deploy.env apps/api/.env > merged.env

                  rsync -avz -e "ssh -o StrictHostKeyChecking=accept-new" \
                    docker-compose.prod.yml \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/apps/bzim/docker-compose.yml

                  rsync -avz -e "ssh -o StrictHostKeyChecking=accept-new" \
                    merged.env \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/apps/bzim/.env

            # Only the api service: the web image is deployed by deploy-web.yml
            # and should not be pulled or restarted by an API-only change.
            - name: Deploy with Docker Compose
              run: |
                  ssh -o StrictHostKeyChecking=accept-new \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
                    set -e
                    cd /opt/apps/bzim

                    docker compose pull api
                    docker compose up -d api

                    # start_period is 30s, so allow comfortably more than that
                    # before calling it a failure.
                    for i in $(seq 1 18); do
                      if docker compose ps | grep -q "bzim-api.*healthy"; then
                        echo "Container healthy after $((i * 5))s."
                        break
                      fi
                      sleep 5
                    done

                    docker compose ps

                    if ! docker compose ps | grep -q "bzim-api.*healthy"; then
                      echo "Container never became healthy. Last 50 lines:"
                      docker compose logs --tail=50 api
                      exit 1
                    fi
                  ENDSSH

            # Ofelia reads container labels when *it* starts, not when a
            # labelled container appears. A job that did not exist the last time
            # it started is never picked up, so the scheduler is restarted on
            # every deploy and the registration is verified rather than assumed.
            - name: Re-register the worker jobs with the scheduler
              run: |
                  ssh -o StrictHostKeyChecking=accept-new \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
                    set -e
                    docker restart scheduler
                    sleep 5

                    if ! docker logs scheduler 2>&1 | tail -30 | grep -q 'bzim-cleanup'; then
                      echo "The scheduler restarted without registering bzim-cleanup."
                      docker logs scheduler --tail=30
                      exit 1
                    fi
                    echo "bzim worker jobs registered."
                  ENDSSH

            # After the container is up, not before: the image is what carries
            # the migrations, and running them from anywhere else would mean a
            # second copy of the schema history.
            - name: Run database migrations
              run: |
                  ssh -o StrictHostKeyChecking=accept-new \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
                    set -e
                    cd /opt/apps/bzim

                    # The container's own environment is already loaded from
                    # .env by compose, so nothing needs sourcing here. The
                    # knexfile detects that it is running compiled and looks for
                    # .js migrations rather than .ts.
                    docker compose exec -T api \
                      npx knex migrate:latest --knexfile dist/database/knexfile.js
                  ENDSSH

            - name: Verify
              run: |
                  ssh -o StrictHostKeyChecking=accept-new \
                    ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
                    set -e
                    cd /opt/apps/bzim

                    # Reports the database separately, so a process that is up
                    # but cannot reach MySQL fails here rather than at midnight.
                    docker compose exec -T api \
                      wget -qO- http://127.0.0.1:3000/api/v1/health
                  ENDSSH
