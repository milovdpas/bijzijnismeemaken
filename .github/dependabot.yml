# Weekly dependency updates, batched so Monday brings one pull request per
# ecosystem rather than twenty. Majors come on their own: they are the ones
# that need reading. The npm workspaces share the root lockfile, so one npm
# entry at the root covers packages/* and apps/*.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '07:00'
          timezone: Europe/Amsterdam
      open-pull-requests-limit: 5
      groups:
          minor-and-patch:
              update-types: [minor, patch]
          # ESLint and its plugins only work as a set: a new ESLint major
          # comes with its @eslint/js and typescript-eslint, in one PR.
          eslint:
              patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'eslint-*']
              update-types: [major]
      ignore:
          # The Node types follow the runtime in the Dockerfiles, by hand.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
          # A TypeScript major is a deliberate move: Next and typescript-eslint
          # have to support it first.
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major']
      commit-message:
          prefix: 'chore'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '07:00'
          timezone: Europe/Amsterdam
      commit-message:
          prefix: 'chore'

    # The images stay on the Node LTS line (even majors); a move to the next
    # LTS is done by hand, together with CI and the engines field.
    - package-ecosystem: docker
      directory: /apps/api
      schedule:
          interval: weekly
          day: monday
          time: '07:00'
          timezone: Europe/Amsterdam
      ignore:
          - dependency-name: 'node'
            update-types: ['version-update:semver-major']
      commit-message:
          prefix: 'chore'

    - package-ecosystem: docker
      directory: /apps/web
      schedule:
          interval: weekly
          day: monday
          time: '07:00'
          timezone: Europe/Amsterdam
      ignore:
          - dependency-name: 'node'
            update-types: ['version-update:semver-major']
      commit-message:
          prefix: 'chore'
